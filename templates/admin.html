<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTI - Panel de Administración</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .navbar h1 {
            font-size: 28px;
        }
        
        .navbar-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .refresh-btn, .logout-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover, .logout-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 14px;
            color: #999;
            font-weight: 500;
        }
        
        .stat-meta {
            font-size: 12px;
            color: #bbb;
            margin-top: 8px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .chart-card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        .table-card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f8f8f8;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e0e0e0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f8f8f8;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-admin {
            background: #667eea;
            color: white;
        }
        
        .badge-user {
            background: #764ba2;
            color: white;
        }
        
        .badge-active {
            background: #4caf50;
            color: white;
        }
        
        .badge-inactive {
            background: #f44336;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <div class="navbar">
        <h1>🎯 Panel de Administración BOTI</h1>
        <div class="navbar-right">
            <span id="adminName">👤 Administrador</span>
            <button class="refresh-btn" onclick="refreshData()">🔄 Actualizar</button>
            <button class="logout-btn" onclick="logout()">🔐 Salir</button>
        </div>
    </div>
    
    <div class="container">
        <!-- ESTADÍSTICAS -->
        <div class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                Cargando datos...
            </div>
        </div>
        
        <!-- GRÁFICOS -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 Usuarios por Región</h3>
                <canvas id="regionChart"></canvas>
            </div>
            
            <div class="chart-card">
                <h3>👥 Distribución de Roles</h3>
                <canvas id="rolesChart"></canvas>
            </div>
        </div>
        
        <!-- TABLA DE USUARIOS -->
        <div class="table-card">
            <h3>👥 Últimos Usuarios Registrados</h3>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Conversaciones</th>
                        <th>Consentimiento</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #999;">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- TABLA DE ESTADÍSTICAS DETALLADAS -->
        <div style="margin-top: 30px;">
            <div class="table-card">
                <h3>📈 Estadísticas Detalladas</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Métrica</th>
                            <th>Valor</th>
                            <th>Cambio</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <tr>
                            <td colspan="3" style="text-align: center; color: #999;">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        let dashboardData = {};
        let charts = {};
        
        // Verificar autenticación
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/verify');
                const data = await response.json();
                
                if (!data.success || data.user.role !== 'admin') {
                    window.location.href = '/auth/login';
                } else {
                    document.getElementById('adminName').textContent = `👤 ${data.user.username}`;
                }
            } catch (error) {
                window.location.href = '/auth/login';
            }
        }
        
        // Cargar datos del dashboard
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/admin/dashboard-data');
                const data = await response.json();
                
                if (data.success) {
                    dashboardData = data.data;
                    renderStats();
                    renderCharts();
                    renderUsersTable();
                    renderStatsTable();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // Renderizar tarjetas de estadísticas
        function renderStats() {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';
            
            const stats = [
                {
                    label: 'Total de Usuarios',
                    value: dashboardData.total_users || 0,
                    icon: '👥',
                    meta: 'Registrados'
                },
                {
                    label: 'Conversaciones Activas',
                    value: dashboardData.total_conversations || 0,
                    icon: '💬',
                    meta: 'En el sistema'
                },
                {
                    label: 'Menores Conectados',
                    value: dashboardData.children_connected || 0,
                    icon: '👶',
                    meta: 'Menores de edad'
                },
                {
                    label: 'Sponsors Activos',
                    value: dashboardData.active_sponsors || 0,
                    icon: '🏢',
                    meta: 'Empresas asociadas'
                },
                {
                    label: 'Regiones Cubiertas',
                    value: dashboardData.regions_covered || 0,
                    icon: '🗺️',
                    meta: 'Departamentos'
                },
                {
                    label: 'Consentimientos Otorgados',
                    value: dashboardData.total_consents || 0,
                    icon: '✅',
                    meta: 'LSRPD compliance'
                }
            ];
            
            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div style="font-size: 24px;">${stat.icon}</div>
                    <div class="stat-label">${stat.label}</div>
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-meta">${stat.meta}</div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Renderizar gráficos
        function renderCharts() {
            // Gráfico de usuarios por región
            const regionCtx = document.getElementById('regionChart').getContext('2d');
            if (charts.region) charts.region.destroy();
            
            const regionData = dashboardData.users_by_region || {};
            charts.region = new Chart(regionCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(regionData),
                    datasets: [{
                        label: 'Usuarios',
                        data: Object.values(regionData),
                        backgroundColor: '#667eea',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {display: false}
                    },
                    scales: {
                        y: {beginAtZero: true}
                    }
                }
            });
            
            // Gráfico de roles
            const rolesCtx = document.getElementById('rolesChart').getContext('2d');
            if (charts.roles) charts.roles.destroy();
            
            charts.roles = new Chart(rolesCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Administradores', 'Usuarios'],
                    datasets: [{
                        data: [
                            dashboardData.admin_count || 0,
                            dashboardData.user_count || 0
                        ],
                        backgroundColor: ['#667eea', '#764ba2'],
                        borderColor: white,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        // Renderizar tabla de usuarios
        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            
            const users = dashboardData.latest_users || [];
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">Sin usuarios</td></tr>';
                return;
            }
            
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(user.username || 'N/A')}</td>
                    <td>${escapeHtml(user.email || 'N/A')}</td>
                    <td><span class="badge badge-${user.role}">${user.role}</span></td>
                    <td>${user.conversation_count || 0}</td>
                    <td><span class="badge badge-${user.consent ? 'active' : 'inactive'}">${user.consent ? '✓ Dado' : '✗ Pendiente'}</span></td>
                `;
                tbody.appendChild(row);
            });
        }
        
        // Renderizar tabla de estadísticas
        function renderStatsTable() {
            const tbody = document.getElementById('statsTableBody');
            tbody.innerHTML = '';
            
            const stats = [
                {
                    metric: 'Tasa de Consentimiento',
                    value: `${dashboardData.consent_rate || 0}%`,
                    change: '+5% vs mes pasado'
                },
                {
                    metric: 'Mensajes por Conversación',
                    value: dashboardData.avg_messages_per_conversation || 0,
                    change: '+2.3 vs promedio histórico'
                },
                {
                    metric: 'Cobertura de Subsídios',
                    value: `${dashboardData.subsidy_coverage || 0}%`,
                    change: '+12% gracias a sponsors'
                },
                {
                    metric: 'Satisfacción Usuarios',
                    value: dashboardData.user_satisfaction || '8.5/10',
                    change: 'Estable'
                }
            ];
            
            stats.forEach(stat => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${stat.metric}</strong></td>
                    <td style="font-size: 18px; font-weight: bold; color: #667eea;">${stat.value}</td>
                    <td style="color: #4caf50; font-size: 12px;">${stat.change}</td>
                `;
                tbody.appendChild(row);
            });
        }
        
        // Refrescar datos
        function refreshData() {
            loadDashboardData();
        }
        
        // Auto-refrescar cada 30 segundos
        setInterval(loadDashboardData, 30000);
        
        // Logout
        async function logout() {
            await fetch('/api/auth/logout', {method: 'POST'});
            window.location.href = '/auth/login';
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // Inicializar
        checkAuth();
        loadDashboardData();
    </script>
</body>
</html>
